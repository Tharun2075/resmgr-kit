# Emergency-stop latch: writing "1" trips it, a read returns the state, and
# clients register with ARM_NOTIFY to get a pulse when it trips.
# Why a pulse, not polling: a client that polls read() at 10 ms sees a trip up to
# one period late and burns a wakeup every period; the pulse is sent by the
# server (MsgDeliverEvent) in the same write that trips the latch, so the client
# sleeps in MsgReceivePulse until then. For what a 10 ms pulse period looks like on our
# QEMU target (method, not real-time evidence) see docs/evidence/latency.md.
name: estop
path: /dev/estop0
description: Emergency-stop latch with trip notification
state:
  - {name: tripped, type: int32, min: 0, max: 1, init: 0}
  - {name: trips, type: uint32, init: 0}
read:
  fields: [tripped, trips]
write:
  field: tripped
  out_of_range: reject
devctls:
  - {name: ARM_NOTIFY, code: 1, op: notify}
  - {name: GET_STATE, code: 2, op: get, field: tripped}
  - {name: RESET, code: 3, op: set, field: tripped}
notify:
  field: tripped
  equals: 1
  count_field: trips
